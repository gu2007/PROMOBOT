<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROMOBOT - Importar com IA</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <button class="botaoMenu" id="botaoMenu" aria-label="Abrir menu">☰</button>
    <div class="overlayMenu" id="overlayMenu"></div>
    <aside class="sidebar" id="sidebar">
        <h2>PROMOBOT</h2>
        <nav>

            <a href="/">Dashboard</a>

            <details class="grupoMenu" open>
                <summary>Produtos</summary>
                <div class="submenu">
                    <a href="/produtos">Todos os produtos</a>
                    <a href="/novo-produto">Novo produto</a>
                    <a href="/importar-ia" class="ativo">Importações</a>
                    <a href="/duplicados">Duplicados</a>
                    <a href="/alteracoes">Alterações</a>
                </div>
            </details>

            <a href="#">Divulgações</a>

            <a href="/configuracoes">Configurações</a>

            <a href="#">Estatísticas</a>

            <a href="#">Logs</a>

        </nav>
    </aside>
    <main>

        <h1 style="margin-bottom:20px;">Importar produtos com IA</h1>

        <div class="formulario" style="max-width:700px;">

            <div class="abasFormulario" id="abasImportar">
                <button type="button" class="abaFormulario ativa" data-aba="link" onclick="mudarAba('link')">Link</button>
                <button type="button" class="abaFormulario" data-aba="arquivo" onclick="mudarAba('arquivo')">Arquivo (PDF/Word)</button>
                <button type="button" class="abaFormulario" data-aba="texto" onclick="mudarAba('texto')">Texto colado</button>
            </div>

            <div id="abaLink">
                <div class="campoFormulario">
                    <label for="linkPagina">Link de uma página de busca/categoria do Mercado Livre</label>
                    <input type="text" id="linkPagina" placeholder="https://lista.mercadolivre.com.br/...">
                </div>
                <button id="btnBuscarLink" class="primario">Buscar produtos pelo link</button>
            </div>

            <div id="abaArquivo" style="display: none;">
                <div class="campoFormulario">
                    <label for="arquivoProdutos">Arquivo PDF ou Word (.docx) com os produtos</label>
                    <input type="file" id="arquivoProdutos" accept=".pdf,.docx">
                </div>
                <button id="btnBuscarArquivo" class="primario">Buscar produtos no arquivo</button>
            </div>

            <div id="abaTexto" style="display: none;">
                <div class="campoFormulario">
                    <label for="textoProdutos">Texto copiado da página de produtos</label>
                    <textarea id="textoProdutos" rows="3" class="campoExpandivel" placeholder="Cole aqui o texto copiado da página..."></textarea>
                </div>
                <button id="btnBuscarTexto" class="primario">Buscar produtos no texto</button>
            </div>

            <p id="mensagemStatus" class="mensagemFormulario"></p>

            <div id="areaStreaming" class="logAtividade" style="display: none; margin-top: 12px;"></div>

        </div>

        <div id="resultados" style="margin-top:20px; max-width:700px;"></div>

    </main>
    <script src="assets/js/importar-ia.js"></script>
    <script src="assets/js/menu.js"></script>
</body>
</html>
