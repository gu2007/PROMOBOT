<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROMOBOT - Importar com IA</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <button class="botaoMenu" id="botaoMenu" aria-label="Abrir menu">☰</button>
    <div class="overlayMenu" id="overlayMenu"></div>
    <aside class="sidebar" id="sidebar">
        <h2>PROMOBOT</h2>
        <nav>

            <a href="/">Dashboard</a>

            <details class="grupoMenu" open>
                <summary>Produtos</summary>
                <div class="submenu">
                    <a href="/produtos">Todos os produtos</a>
                    <a href="/novo-produto">Novo produto</a>
                    <a href="/importar-ia" class="ativo">Importações</a>
                    <a href="/duplicados">Duplicados</a>
                    <a href="/alteracoes">Alterações</a>
                </div>
            </details>

            <a href="#">Divulgações</a>

            <a href="/configuracoes">Configurações</a>

            <a href="#">Estatísticas</a>

            <a href="#">Logs</a>

        </nav>
    </aside>
    <main>
        <header>
            <h1>Importar produtos com IA</h1>
        </header>
        <section class="card" style="max-width: 700px;">
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button type="button" class="botaoAba" data-aba="link" onclick="mudarAba('link')">🔗 Link</button>
                <button type="button" class="botaoAba" data-aba="arquivo" onclick="mudarAba('arquivo')">📎 Arquivo (PDF/Word)</button>
                <button type="button" class="botaoAba" data-aba="texto" onclick="mudarAba('texto')">📝 Texto colado</button>
            </div>
            <div id="abaLink">
                <label>Cole o link de uma página de busca/categoria do Mercado Livre</label>
                <input type="text" id="linkPagina" placeholder="https://lista.mercadolivre.com.br/...">
                <br><br>
                <button id="btnBuscarLink">🔍 Buscar produtos pelo link</button>
            </div>
            <div id="abaArquivo" style="display: none;">
                <label>Envie um arquivo PDF ou Word (.docx) com os produtos</label>
                <input type="file" id="arquivoProdutos" accept=".pdf,.docx">
                <br><br>
                <button id="btnBuscarArquivo">🔍 Buscar produtos no arquivo</button>
            </div>
            <div id="abaTexto" style="display: none;">
                <label>Cole abaixo o texto copiado da página de produtos</label>
                <textarea id="textoProdutos" rows="8" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc;" placeholder="Cole aqui o texto copiado da página..."></textarea>
                <br><br>
                <button id="btnBuscarTexto">🔍 Buscar produtos no texto</button>
            </div>
            <p id="mensagemStatus"></p>
            <pre id="areaStreaming" style="display: none; background: #111; color: #0f0; padding: 15px; border-radius: 8px; max-height: 300px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; font-size: 12px;"></pre>
        </section>
        <section id="resultados"></section>
    </main>
    <script src="assets/js/importar-ia.js"></script>
    <script src="assets/js/menu.js"></script>
</body>
</html>
