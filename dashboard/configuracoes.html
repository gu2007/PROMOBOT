<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - PROMOBOT</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <button class="botaoMenu" id="botaoMenu" aria-label="Abrir menu">☰</button>
    <div class="overlayMenu" id="overlayMenu"></div>
    <aside class="sidebar" id="sidebar">
        <h2>PROMOBOT</h2>
        <nav>

            <a href="/dashboard">Dashboard</a>

            <details class="grupoMenu">
                <summary>Produtos</summary>
                <div class="submenu">
                    <a href="/produtos">Todos os produtos</a>
                    <a href="/novo-produto">Novo produto</a>
                    <a href="/importar-ia">Importações</a>
                    <a href="/duplicados">Duplicados</a>
                    <a href="/alteracoes">Alterações</a>
                </div>
            </details>

            <a href="#">Divulgações</a>

            <a href="/configuracoes" class="ativo">Configurações</a>

            <a href="#">Estatísticas</a>

            <a href="#">Logs</a>

        </nav>
    </aside>
    <main>

        <h1 style="margin-bottom:20px;">Configurações</h1>

        <div class="formulario">

            <div class="campoFormulario">
                <label for="nicho">Nicho</label>
                <input id="nicho" type="text">
            </div>

            <div class="linhaFormulario">

                <div class="campoFormulario">
                    <label for="horarioInicio">Horário inicial</label>
                    <input id="horarioInicio" type="number" min="0" max="23">
                </div>

                <div class="campoFormulario">
                    <label for="horarioFim">Horário final</label>
                    <input id="horarioFim" type="number" min="0" max="23">
                </div>

            </div>

            <div class="linhaFormulario">

                <div class="campoFormulario">
                    <label for="produtosPorHora">Produtos por hora</label>
                    <input id="produtosPorHora" type="number" min="1">
                </div>

                <div class="campoFormulario">
                    <label for="intervaloRepeticaoHoras">Repetir produto após (horas)</label>
                    <input id="intervaloRepeticaoHoras" type="number" min="1">
                </div>

            </div>

            <div class="acoesFormulario">
                <button id="salvar" class="primario">Salvar configurações</button>
                <span id="mensagem" class="mensagemFormulario"></span>
            </div>

        </div>

    </main>
    <script src="assets/js/configuracoes.js"></script>
    <script src="assets/js/menu.js"></script>
</body>
</html>
