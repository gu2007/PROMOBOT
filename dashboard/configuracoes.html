<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Configurações - PROMOBOT</title>

    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

    <aside class="sidebar">

        <h2>PROMOBOT</h2>

        <nav>

            <a href="/dashboard">🏠 Dashboard</a>

            <a href="/produtos">📦 Produtos</a>

            <a href="/importar-ia">📥 Importações</a>

            <a href="/duplicados">⚠️ Duplicados</a>

            <a href="#">📤 Divulgações</a>

            <a href="/configuracoes">⚙️ Configurações</a>

            <a href="#">📊 Estatísticas</a>

            <a href="#">📜 Logs</a>

        </nav>

    </aside>

    <main>

        <h1>Configurações</h1>

        <div class="card">

            <label>Nicho</label>
            <input id="nicho" type="text">

            <label>Horário Inicial</label>
            <input id="horarioInicio" type="number" min="0" max="23">

            <label>Horário Final</label>
            <input id="horarioFim" type="number" min="0" max="23">

            <label>Produtos por Hora</label>
            <input id="produtosPorHora" type="number" min="1">

            <label>Repetir produto após quantas horas</label>
            <input id="intervaloRepeticaoHoras" type="number" min="1">

            <br><br>

            <br><br>

            <button id="salvar">
                Salvar Configurações
            </button>

            <p id="mensagem"></p>

        </div>

    </main>

    <script src="assets/js/configuracoes.js"></script>

</body>

</html>
