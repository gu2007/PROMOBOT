<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d2217">
    <title>Início - I Ama Promos</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <main>

        <!-- Cabeçalho: saudação + título -->
        <div class="cabecalhoPagina">
            <div>
                <p class="sobretitulo" id="saudacao">Olá</p>
                <h1>Início</h1>
            </div>
        </div>

        <div class="colunasInicio">

            <!-- COLUNA 1: robô + números + atenção -->
            <div>

                <!-- Cartão do robô (preenchido pelo app.js) -->
                <section class="cartaoRobo" aria-live="polite">
                    <div class="topoRobo">
                        <span>Robô do WhatsApp</span>
                        <span class="pilulaStatus" id="pilulaRobo">Carregando</span>
                    </div>
                    <p class="fraseRobo" id="fraseRobo">Carregando...</p>
                    <p class="detalheRobo" id="detalheRobo">&nbsp;</p>
                    <div class="acoesRobo">
                        <button id="btnSistema" class="botaoClaro">Carregando...</button>
                        <a href="/configuracoes" class="botao botaoContornoClaro">Ajustar horário</a>
                    </div>
                </section>

                <!-- Números principais -->
                <div class="numeros">
                    <a href="/produtos?status=ativas" class="numero"><span>Ofertas ativas</span><strong id="numAtivas">–</strong></a>
                    <a href="/produtos?status=pausadas" class="numero"><span>Pausadas</span><strong id="numPausadas">–</strong></a>
                    <div class="numero"><span>Postadas hoje</span><strong id="numHoje">–</strong></div>
                    <a href="/produtos" class="numero"><span>Categorias</span><strong id="numCategorias">–</strong></a>
                </div>

                <!-- Lista do que precisa ser resolvido -->
                <div class="tituloSecao">
                    <h2>Precisa da sua atenção</h2>
                </div>
                <div class="listaAtencao" id="listaAtencao">
                    <div class="carregando" style="height:60px; margin:12px 0;"></div>
                </div>

            </div>

            <!-- COLUNA 2: categorias + últimas postadas -->
            <div>

                <div class="tituloSecao">
                    <h2>Ofertas por categoria</h2>
                    <a href="/produtos">Ver todas</a>
                </div>
                <div class="listaCategorias" id="listaCategorias">
                    <div class="carregando" style="height:60px; margin:10px 0;"></div>
                </div>

                <div class="tituloSecao">
                    <h2>Postadas por último</h2>
                </div>
                <div class="fileiraMini" id="ultimasPostadas">
                    <div class="carregando" style="flex:0 0 120px; height:120px;"></div>
                    <div class="carregando" style="flex:0 0 120px; height:120px;"></div>
                    <div class="carregando" style="flex:0 0 120px; height:120px;"></div>
                </div>

            </div>

        </div>

    </main>

    <!-- menu.js primeiro: ele cria a navegação e as funções que o app.js usa -->
    <script src="assets/js/menu.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
