<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d2217">
    <title>Ofertas - I Ama Promos</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <main>

        <!-- Título + botões (nova oferta e ferramentas) -->
        <div class="cabecalhoPagina">
            <h1>Ofertas</h1>
            <div class="acoesCabecalho">
                <button class="fantasma redondo" id="btnFerramentas" aria-label="Ferramentas"></button>
                <a href="/novo-produto" class="botao primario" id="btnNovaOferta"></a>
            </div>
        </div>

        <div class="layoutOfertas">

            <!-- Filtros fixos à esquerda (só no PC) -->
            <aside class="filtrosLaterais" id="filtrosLaterais" aria-label="Filtros"></aside>

            <div>
                <!-- Busca + botão de filtros (o botão só aparece no celular) -->
                <div class="barraBusca">
                    <label for="filtroBusca" class="soLeitor">Buscar oferta</label>
                    <input type="search" id="filtroBusca" class="campoBusca" placeholder="Buscar oferta" autocomplete="off">
                    <button class="redondo botaoComPonto soCelular" id="btnFiltros" aria-label="Filtros"></button>
                </div>

                <!-- Categorias em chips (celular/tablet) -->
                <div class="listaChips soCelular" id="chipsCategorias"></div>

                <!-- "318 ofertas" + ordem -->
                <div class="resumoLista">
                    <span id="resumoQuantidade" aria-live="polite">Carregando...</span>
                    <label class="soLeitor" for="ordem">Ordenar</label>
                    <select id="ordem" class="seletorOrdem">
                        <option value="recentes">Mais recentes</option>
                        <option value="desconto">Maior desconto</option>
                        <option value="menorPreco">Menor preço</option>
                        <option value="maiorPreco">Maior preço</option>
                    </select>
                </div>

                <!-- Resultado das ferramentas (só aparece quando roda alguma) -->
                <p id="mensagemResolucao" class="mensagemFormulario"></p>
                <div id="areaResolucao" class="logAtividade" style="display:none; margin-bottom:16px;"></div>

                <!-- Grade de ofertas (preenchida pelo produtos.js) -->
                <div class="gradeOfertas" id="gradeOfertas"></div>

                <div class="maisOfertas">
                    <button id="btnMostrarMais" style="display:none;">Mostrar mais</button>
                </div>
            </div>

        </div>

    </main>

    <script src="assets/js/menu.js"></script>
    <script src="assets/js/produtos.js"></script>
</body>
</html>
